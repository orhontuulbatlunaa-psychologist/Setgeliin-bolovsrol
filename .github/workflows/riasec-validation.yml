name: Validate RIASEC source data

on:
  push:
    branches:
      - feature/holland-riasec-platform
    paths:
      - "career-test/**"
      - "api/**"
      - "supabase/**"
      - ".github/workflows/riasec-validation.yml"
  pull_request:
    paths:
      - "career-test/**"
      - "api/**"
      - "supabase/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check assessment JavaScript syntax
        working-directory: career-test
        run: |
          node --check ./data.js
          node --check ./scoring.js
          node --check ./app.js
          node --check ./report-template.js
          node --check ./validate-data.mjs
      - name: Check server JavaScript syntax
        run: find api -name "*.js" -type f -print0 | xargs -0 -n1 node --check
      - name: Validate source counts and scoring rules
        working-directory: career-test
        run: node ./validate-data.mjs
