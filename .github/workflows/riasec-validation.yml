name: Validate RIASEC source data

on:
  push:
    branches:
      - feature/holland-riasec-platform
    paths:
      - "career-test/**"
      - ".github/workflows/riasec-validation.yml"
  pull_request:
    paths:
      - "career-test/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate source counts and scoring rules
        working-directory: career-test
        run: node ./validate-data.mjs
